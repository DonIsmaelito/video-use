<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Video preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:inherit;font-family:system-ui,sans-serif}
figure{margin:0}img,video{display:block;width:100%;height:auto;max-height:540px;object-fit:contain}
#download{display:block;margin:8px 0 0 auto;padding:6px 10px;border:0;border-radius:5px;background:transparent;color:inherit;font:inherit;font-size:12px;cursor:pointer}
#download:hover{text-decoration:underline}#download:focus-visible{outline:2px solid #a879ef;outline-offset:2px}
#options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.option video{border-radius:8px}.option button{font:inherit;font-size:14px;margin-top:8px;padding:7px 12px;border:1px solid #8d70b7;border-radius:7px;background:transparent;color:inherit;cursor:pointer}.option button[aria-pressed=true]{background:#673dac;color:white}.option p,#sample-label{font-size:12px;opacity:.7;margin:5px 0}#question{font-size:16px;margin:0 0 10px}@media(max-width:440px){#options{grid-template-columns:1fr}}
.source-select{display:flex;gap:12px;align-items:center;padding:16px 0}.source-select input{max-width:70%;font:inherit;font-size:13px}#source-library,#source-fallback{font:inherit;font-size:12px;background:transparent;color:inherit;border:1px solid #8d70b7;border-radius:6px;padding:6px 10px;cursor:pointer;margin:4px 8px 0 0}#source-status{font-size:13px}
#notice{font-size:12px;margin:6px 0}#notice:empty,[hidden]{display:none!important}
.widget-heading{font-size:16px;font-weight:600;margin:0 0 14px}.brief-question{border:0;padding:0;margin:0 0 16px;min-width:0}.brief-question legend{font-size:14px;margin-bottom:8px}.brief-options{display:flex;flex-wrap:wrap;gap:8px}.brief-options button,#widget-submit,#widget-latest{font:inherit;font-size:13px;border:1px solid #8160ae;border-radius:8px;background:transparent;color:inherit;padding:8px 12px;cursor:pointer}.brief-options button[aria-pressed=true]{background:#673dac;color:#fff}.brief-options small{display:block;font-size:10px;opacity:.75;margin-top:3px}.widget-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}#widget-submit{background:#673dac;color:#fff;border-color:transparent}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #bc96ff;outline-offset:2px}#widget-status{font-size:12px;margin:8px 0 0}#widget-status:empty{display:none}.story-strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px}.story-beat{flex:0 0 min(280px,85vw);min-width:0;background:rgba(14,11,20,.86);color:#f4efff;border:1px solid #3c2d52;border-radius:12px;padding:14px;scroll-snap-align:start}.beat-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}.beat-heading span{font-size:12px;color:#cdb7ed}.beat-duration{display:flex;align-items:center;gap:5px;font-size:12px}.beat-duration input{width:65px}.story-beat label{display:block;font-size:11px;color:#cdb7ed;margin-top:10px}.story-beat input,.story-beat textarea{width:100%;font:inherit;font-size:13px;background:#100d16;color:#f4efff;border:1px solid #584269;border-radius:6px;padding:7px;margin-top:5px}.story-beat textarea{resize:vertical;line-height:1.45}.story-beat .beat-duration input{width:65px;margin:0}.fullscreen #media video,.fullscreen #media img{max-height:calc(100vh - 70px)}
#excerpt{font-size:11px;opacity:.65;margin:6px 0 0}
.media-actions{display:flex;justify-content:flex-end;gap:8px;align-items:center}.media-actions button,#feedback-form button{font:inherit;font-size:12px;background:transparent;color:inherit;border:0;padding:6px 10px;cursor:pointer}#download{margin:0}.media-actions button:hover,#feedback-form button:hover{text-decoration:underline}#feedback-form{margin-top:8px}#feedback-time{display:block;font-size:12px;opacity:.75;margin-bottom:6px}#feedback-note{display:block;width:100%;font:inherit;font-size:13px;background:transparent;color:inherit;border:1px solid #8d70b7;border-radius:6px;padding:8px;resize:vertical}#feedback-form .feedback-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}#feedback-form button[type=submit]{background:#673dac;color:white;border-radius:6px}#feedback-note:focus-visible,#feedback-form button:focus-visible,#suggest-edit:focus-visible{outline:2px solid #a879ef;outline-offset:2px}
/* Keep controls readable even when the host leaves iframe theme tokens unset. */
html,body{color:#f4efff;color-scheme:dark}#visual{background:#15111d;color:#f4efff;border-radius:10px;overflow:hidden}.media-actions{flex-wrap:wrap;justify-content:flex-start;padding:10px;gap:8px}.media-actions button,#feedback-form button{background:#2a2038;color:#f4efff;border:1px solid #71558e;border-radius:7px;padding:8px 12px;line-height:1.3;min-height:34px}.media-actions #suggest-edit,#feedback-form #feedback-send{background:#6f40af;color:#fff;border-color:#ab83dc;font-weight:600}.media-actions #download{margin-left:auto;background:#2a2038;color:#f4efff;border:1px solid #71558e;border-radius:7px;padding:8px 12px}.media-actions button:hover,#feedback-form button:hover{background:#3b2b50;text-decoration:none}.media-actions #suggest-edit:hover,#feedback-form #feedback-send:hover{background:#8150bd}#feedback-shortcuts{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}#feedback-shortcuts button{font:inherit;font-size:12px;line-height:1.3;background:#21192d;color:#eaddff;border:1px solid #655078;border-radius:18px;padding:7px 11px;cursor:pointer}#feedback-shortcuts button:hover{background:#39294b}#feedback-form{margin:0;padding:2px 10px 12px;background:#15111d;color:#f4efff}#feedback-time{color:#ddd0ee;opacity:1}#feedback-note{background:#100c17;color:#f4efff;border-color:#8a6aa7;font-size:14px;line-height:1.5}#feedback-note::placeholder{color:#beafce;opacity:1}#notice{color:#eee4fa;background:#21192d;border-radius:6px;padding:8px 10px}#excerpt{color:#ddd0ee;opacity:1;padding:6px 10px 0;margin:0}.brief-options button,.option button,#widget-latest,#source-library,#source-fallback{background:#21192d;color:#f4efff}#widget,#choices,#sources{background:#15111d;color:#f4efff;padding:12px;border-radius:10px}
</style>
</head>
<body>
<section id="choices" hidden><p id="question"></p><div id="options"></div><p id="sample-label">Style references · You can also describe your own direction.</p></section>
<section id="sources" hidden><label class="source-select">Add your files<input id="source-files" type="file" multiple></label><button id="source-library" hidden>Choose from ChatGPT files</button><button id="source-fallback">Open upload page</button><p id="source-status" role="status"></p></section>
<section id="widget" hidden aria-labelledby="widget-title"><form id="widget-form"><h2 id="widget-title" class="widget-heading"></h2><div id="widget-fields"></div><p id="widget-status" role="status" aria-live="polite"></p><div class="widget-actions"><button id="widget-latest" type="button" hidden>Load latest · discard my edits</button><button id="widget-submit" type="submit" disabled>Save preferences</button></div></form></section>
<figure id="visual" hidden><div id="media"></div><p id="excerpt" hidden></p><div class="media-actions"><button id="suggest-edit" hidden>Edit this moment</button><button id="expand" hidden>Expand</button><button id="download" hidden>Download MP4</button></div><div id="feedback-shortcuts" role="group" aria-label="Start an editing suggestion" hidden><button id="edit-labels" type="button">Larger labels</button><button id="edit-pace" type="button">Faster pace</button><button id="edit-look" type="button">Change the look</button></div><form id="feedback-form" hidden><label id="feedback-time" for="feedback-note"></label><textarea id="feedback-note" rows="2" maxlength="1200" placeholder="What would you change here?" required></textarea><div class="feedback-actions"><button id="feedback-cancel" type="button">Cancel</button><button id="feedback-send" type="submit">Send edit</button></div></form></figure>
<p id="notice" role="status"></p>
<script>/* APP_BUNDLE */</script>
</body>
</html>
