<!doctype html><html><head><meta charset="utf-8"><title>Night bloom</title><style>html,body{margin:0;overflow:hidden;background:#050306}canvas{display:block}</style></head><body><canvas width="1920" height="1080"></canvas><script type="module">
import {createBotanicalEditorial} from './botanical-editorial.mjs';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let film;
const e=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function pose(t){
 if(t<.9)film.render(ctx,{mode:'macro',focus:[.32+t*.02,.67-t*.02],zoom:2.30-t*.2,rotation:-.08+t*.025});
 else if(t<1.65)film.render(ctx,{mode:'strips',progress:e((t-.9)/.75),fromFocus:[.338,.652],fromZoom:2.12,toFocus:[.5,.49],toZoom:.87});
 else if(t<2.7)film.render(ctx,{mode:'hero',zoom:.87+.025*e((t-1.65)/1.05),rotation:-.024*e((t-1.65)/1.05)});
 else if(t<3.4)film.render(ctx,{mode:'macro',focus:[.52,.36],zoom:1.8+(t-2.7)*.20,rotation:.06});
 else if(t<4.1)film.render(ctx,{mode:'macro',focus:[.72-.02*(t-3.4),.57],zoom:2.1,rotation:-.1+(t-3.4)*.1});
 else if(t<4.65)film.render(ctx,{mode:'strips',progress:e((t-4.1)/.55),fromFocus:[.70,.57],fromZoom:2.1,toFocus:[.5,.47],toZoom:1.08,columns:16});
 else if(t<5.65){film.render(ctx,{mode:'radial',opening:.12+.88*e((t-4.65)),twist:.15,zoom:.93,sectors:14});}
 else film.render(ctx,{mode:'hero',zoom:.93-.045*e((t-5.65)/2.35),rotation:-.025+.05*e((t-5.65)/2.35)});
}
window.motionReady=(async()=>{const image=new Image();image.src='./assets/passionflower.png';await image.decode();film=createBotanicalEditorial({image});pose(0)})();window.seek=async t=>{await window.motionReady;pose(t)};
</script></body></html>
