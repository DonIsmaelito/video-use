<!doctype html><html><head><meta charset="utf-8"><title>Paper Koi</title><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f4eddf}canvas{display:block}</style></head><body><canvas id="film" width="1920" height="1080"></canvas>
<script type="module">
import {createPaperKoi} from './paper-koi.mjs';
const W=1920,H=1080,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});
const fish=createPaperKoi();
const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*v*(v*(v*6-15)+10)},mix=(a,b,p)=>a+(b-a)*p;
const paper=document.createElement('canvas');paper.width=paper.height=256;const pg=paper.getContext('2d');pg.fillStyle='#f3ecdc';pg.fillRect(0,0,256,256);let seed=74673;
function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<1500;i++){pg.strokeStyle=i%2?'rgba(139,110,63,.05)':'rgba(255,255,242,.26)';pg.lineWidth=.4+random()*.7;const x=random()*256,y=random()*256;pg.beginPath();pg.moveTo(x,y);pg.lineTo(x+2+random()*8,y+(random()-.5)*2);pg.stroke()}
const bg=ctx.createPattern(paper,'repeat');
function bezier(u){const p0=[790,650],p1=[1290,655],p2=[1260,320],p3=[845,370],v=1-u;return [v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0],v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]]}
function angle(u){const a=bezier(Math.max(0,u-.002)),b=bezier(Math.min(1,u+.002));return Math.atan2(b[1]-a[1],b[0]-a[0])}
function ripple(x,y,age,strength=1){if(age<0||age>4.8)return;const grow=1-Math.pow(1-clamp(age/4.8),2),fade=Math.sin(Math.PI*clamp(age/4.8));ctx.save();ctx.translate(x,y);ctx.scale(1,.61);ctx.rotate(-.19);for(let k=0;k<3;k++){const r=58+grow*310+k*35;ctx.beginPath();for(let i=0;i<=160;i++){const a=i/160*Math.PI*2;const rr=r+Math.sin(a*7+k)*2.4+Math.sin(a*13+.8)*1.3;const px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.strokeStyle=`rgba(25,65,136,${fade*strength*(.46-k*.075)})`;ctx.lineWidth=(2.6-k*.35)*(1-grow*.3);ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle=`rgba(28,69,133,${fade*strength*.035})`;ctx.stroke()}ctx.restore()}
function draw(t){ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const light=ctx.createRadialGradient(1000,460,70,960,540,1130);light.addColorStop(0,'rgba(255,253,242,.5)');light.addColorStop(1,'rgba(162,128,74,.065)');ctx.fillStyle=light;ctx.fillRect(0,0,W,H);
  // Ink displacement is tied to unfolding and distinct tail strokes, not a decorative emitter.
  ripple(890,580,t-.85,.85);ripple(1030,555,t-3.45,.85);ripple(1130,435,t-4.7,.72);ripple(1010,332,t-6.2,.64);
  const open=ease((t-.55)/2.35),swim=ease((t-2.65)/.65),u=clamp((t-2.9)/5.1),travel=bezier(u);
  const rot=mix(-.18,angle(u),swim),bank=Math.abs(Math.sin(rot))*swim;
  const x=mix(920,travel[0],swim),y=mix(560,travel[1],swim)-bank*30;
  const kick=swim*(1+.18*Math.sin(t*1.3)),phase=(t-2.8)*5.2;
  fish.draw(ctx,{x,y,scale:mix(1.3,1.5,open)-.1*ease((t-5)/2.7)-.22*bank*bank,rotation:rot,unfold:open,swim:kick,phase,bend:-.18*swim,finLift:Math.sin(phase+.6),tailSweep:Math.sin(phase-1.8),shadow:1});
}
window.seek=t=>draw(Math.max(0,Math.min(8,t)));window.motionReady=Promise.resolve().then(()=>draw(0));
</script></body></html>
