<!doctype html>
<html><head><meta charset="utf-8"><title>Chrome Beetle</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b092d}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {createChromeBeetle} from './chrome-beetle.mjs';
const DESIGN={width:1920,height:1080,duration:8,wingOpen:1};
const scene=new THREE.Scene();scene.background=new THREE.Color('#1b092d');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(DESIGN.width,DESIGN.height);renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.98;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(35,DESIGN.width/DESIGN.height,.1,100);camera.up.set(0,0,1);
const stage=new THREE.Group();stage.position.z=1.03;scene.add(stage);
const beetle=createChromeBeetle();stage.add(beetle.group);window.beetle=beetle;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#080019',metalness:0,roughness:.96,envMapIntensity:.15}));floor.receiveShadow=true;floor.position.z=-.02;scene.add(floor);
RectAreaLightUniformsLib.init();
const softbox=new THREE.RectAreaLight('#e6efff',8,5,6);softbox.position.set(-3,4,7);softbox.lookAt(0,0,1);scene.add(softbox);
const key=new THREE.DirectionalLight('#ebf2ff',2.5);key.position.set(-3,4,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-7;key.shadow.camera.right=7;key.shadow.camera.top=7;key.shadow.camera.bottom=-7;key.shadow.normalBias=.02;key.shadow.bias=-.0001;key.shadow.radius=4;scene.add(key);
const rim=new THREE.DirectionalLight('#9d66ff',4);rim.position.set(4,-4,4);scene.add(rim);
const edge=new THREE.DirectionalLight('#ffc16d',1.8);edge.position.set(-6,-3,4);scene.add(edge);
scene.add(new THREE.HemisphereLight('#bbc3e6','#1b082c',.7));
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)};
const ramp=(t,a,b)=>ease((t-a)/(b-a));
function choreography(t){
  const opening=ramp(t,1.0,2.8),unfurl=ramp(t,2.25,3.65),flight=ramp(t,3.55,4.35),lift=ramp(t,4.00,6.75);
  const phase=2*Math.PI*(2.7*(t-3.5)+.25*(t-3.5)**2);
  return {wingOpen:opening*DESIGN.wingOpen,unfurl,flight,legTuck:ramp(t,4.1,5.5),flapPhase:phase,antennaSweep:Math.sin(t*2.0)*(.65-.35*lift),lift};
}
function pose(seconds){
  if(!Number.isFinite(Number(seconds)))throw new Error('seek requires finite seconds');
  const t=Math.max(0,Math.min(DESIGN.duration,Number(seconds))),s=choreography(t);
  beetle.setState(s);
  stage.position.set(-.1*ramp(t,5,8),.45*s.lift,1.03+1.8*s.lift+.028*s.flight*Math.sin(t*8));
  stage.rotation.set(.13*s.lift,.04*Math.sin(t*.8)*s.flight,.18-.30*ramp(t,.1,3.1)+.08*ramp(t,5,8));
  const widening=ramp(t,1.1,3.8),distance=10.1+2.55*widening;
  const azimuth=.90-.24*ramp(t,1.4,4.2)+.08*ramp(t,5,8),elevation=.69-.11*ramp(t,2.0,5.0);
  const target=new THREE.Vector3(0,-.03+.32*s.lift,.9+1.5*s.lift);
  camera.position.copy(target).add(new THREE.Vector3(Math.sin(azimuth)*Math.cos(elevation)*distance,Math.cos(azimuth)*Math.cos(elevation)*distance,Math.sin(elevation)*distance));camera.lookAt(target);
  renderer.render(scene,camera);
}
window.motionReady=(async()=>{const hdr=await new HDRLoader().loadAsync('./assets/studio_small_09_1k.hdr');const pmrem=new THREE.PMREMGenerator(renderer);const environment=pmrem.fromEquirectangular(hdr);scene.environment=environment.texture;scene.environmentIntensity=1.25;scene.environmentRotation.set(.15,.25,.75);hdr.dispose();pmrem.dispose();pose(0);})();
window.seek=async seconds=>{await window.motionReady;pose(seconds)};
</script></body></html>
