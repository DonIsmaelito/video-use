<!doctype html><html><head><meta charset="utf-8"><title>Checker Zebra</title><style>html,body{margin:0;overflow:hidden;background:#d9ed48}canvas{display:block}</style></head><body><canvas width="1920" height="1080"></canvas><script type="module">
import {createCheckerZebra} from './checker-zebra.mjs';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),hero=createCheckerZebra();const ease=x=>{x=Math.min(1,Math.max(0,x));return x*x*x*(x*(x*6-15)+10)};
function pose(t){t=Math.max(0,Math.min(8,t));const peel=ease((t-.6)/2.15),run=ease((t-2.15)/.85),phase=Math.max(0,t-2.15)*Math.PI*2*1.45;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#d9ed48';ctx.fillRect(0,0,1920,1080);
 const lift=22*(.5+.5*Math.cos(phase*2))*run;ctx.save();ctx.translate(960,902);ctx.scale(1,.075);const shadow=ctx.createRadialGradient(0,0,10,0,0,490);shadow.addColorStop(0,'rgba(30,36,14,.14)');shadow.addColorStop(1,'rgba(30,36,14,0)');ctx.fillStyle=shadow;ctx.beginPath();ctx.arc(0,0,490,0,Math.PI*2);ctx.fill();ctx.restore();hero.draw(ctx,{x:990+18*Math.sin(t*.9)*run,y:615-lift+20*(1-peel),scale:1.46,peel,phase,gallop:run,rotation:-.08*(1-peel)});
}
window.motionReady=Promise.resolve();window.seek=pose;pose(0);
</script></body></html>
