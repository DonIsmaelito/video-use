<!doctype html><html><head><meta charset="utf-8"><title>Glass staircase</title><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d2432}canvas{display:block}</style><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body><script type="module">
import * as THREE from 'three';import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';import {createGlassStaircase} from './glass-staircase.mjs';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1920,1080);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#0d2432');const camera=new THREE.OrthographicCamera(-5.55,5.55,3.121875,-3.121875,.1,70);camera.position.set(7,6.1,9);camera.lookAt(0,2.25,0);

const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*v*(v*(v*6-15)+10)};
function pose(t){const cascade=ease((t-.65)/4.65),settle=ease((t-5.2)/2.0);stair.setState({cascade,spread:1,settle,phase:t*2.2});stair.group.rotation.y=-.10+.25*ease((t-4.9)/2.8);renderer.render(scene,camera)}
