import * as THREE from 'three';import{HDRLoader}from'three/addons/loaders/HDRLoader.js';import{RectAreaLightUniformsLib}from'three/addons/lights/RectAreaLightUniformsLib.js';import{createColorZipper}from'./color-zipper.mjs';
